server {
    listen 80;
    server_name rimi-ai.pro www.rimi-ai.pro;

    # Max upload size (matches Flask MAX_CONTENT_LENGTH)
    client_max_body_size 25m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Serve React frontend
    location / {
        root /var/www/rimi-ai/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/rimi-ai/dist;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Serve uploaded files
    location /uploads/ {
        alias /var/www/rimi-ai/backend/uploads/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Serve generated results
    location /results/ {
        alias /var/www/rimi-ai/backend/results/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Proxy API requests to Python backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increased timeouts for long-running AI generation requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}
